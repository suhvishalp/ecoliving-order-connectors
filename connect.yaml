# The LHC connector — Sessions 8 and 9 of the commercetools B2C Developer course.
#
# This file is the connector's ENTIRE deployment contract: Connect reads it to know what to build, what
# to run, how to schedule it, and what to ask a human for at install time.
#
# Three rules that catch everyone once:
#   1. `name` MUST match the application's folder in this repository.
#   2. `endpoint` is required for service / event / job, and the app must mount its router at the same
#      path — otherwise the platform's traffic 404s.
#   3. `securedConfiguration` is write-only: entered once at install, never displayed again.
deployAs:
  # ---------------------------------------------------------------------------------------------
  # 8.2 — the cart rules that ran behind a tunnel in Session 7, now hosted by Connect.
  # postDeploy registers the API Extension at CONNECT_SERVICE_URL, WITH authentication.
  # Needs: manage_extensions (to register itself), view_key_value_documents (the feature flags).
  # ---------------------------------------------------------------------------------------------
  - name: cart-rules-service
    applicationType: service
    endpoint: /cart-rules
    scripts:
      postDeploy: npm install && npm run build && npm run connector:post-deploy
      preUndeploy: npm install && npm run build && npm run connector:pre-undeploy
    configuration:
      standardConfiguration:
        - key: MAX_QUANTITY_PER_LINE
          description: >-
            Reject any line above this quantity. Used only when the lhc-config/feature-flags Custom
            Object cannot be read (the connector fails open on its own defaults).
          required: false
          default: '10'
        - key: WHITE_GLOVE_THRESHOLD_CENTS
          description: A line at or above this value (minor units) gets the white-glove flag. Fallback, as above.
          required: false
          default: '40000'
        - key: CONFIG_CACHE_SECONDS
          description: >-
            How long the feature-flag Custom Object is cached. The API Extension budget is 2 seconds, so
            this must not be 0 — a network round trip per cart write spends a real slice of it.
          required: false
          default: '60'
        - key: LOG_LEVEL
          description: debug | info | warn | error
          required: false
          default: 'info'
      securedConfiguration:
        - key: EXTENSION_SECRET
          description: >-
            Shared secret presented by the platform on every Extension call. postDeploy registers the
            Extension with it; the app rejects any call without it. Invent a strong random value per
            installation — the endpoint is on the public internet.
          required: true

  # ---------------------------------------------------------------------------------------------
  # 8.3 — Session 7's poll loop, rewritten as a push handler.
  # Connect provisions the topic; postDeploy creates the Subscription pointing at it.
  # Needs: manage_subscriptions (to register itself), manage_orders + view_states (read and transition).
  # ---------------------------------------------------------------------------------------------
  - name: order-events
    applicationType: event
    endpoint: /order-events
    scripts:
      postDeploy: npm install && npm run build && npm run connector:post-deploy
      preUndeploy: npm install && npm run build && npm run connector:pre-undeploy
    configuration:
      standardConfiguration:
        - key: TARGET_STATE_KEY
          description: >-
            Custom State an order moves to once its payment succeeds. This app talks to the
            commercetools API directly — a deployed connector cannot reach your BFF on localhost.
          required: false
          default: 'order-picked'
        - key: CONFIRM_ORDER_STATE
          description: Also set the built-in orderState to Confirmed alongside the custom transition.
          required: false
          default: 'true'
        - key: MAX_MESSAGE_AGE_HOURS
          description: >-
            Backlog guard. Unacknowledged messages are retained 7 days, so a handler broken over a
            weekend returns to a stampede of stale work; refuse anything older than this.
          required: false
          default: '72'
        - key: LOG_LEVEL
          description: debug | info | warn | error
          required: false
          default: 'info'

  # 8.5 — the Job app (the nightly price feed) lives in its OWN connector, commercetools/ecoliving-price-feed-connector,
  # so it can be installed on its own with its own least-privilege API client.

# ---------------------------------------------------------------------------------------------
# Credentials are NOT asked for at install time.
#
# Declaring apiClient.scopes makes Connect GENERATE an API Client holding exactly these scopes and
# inject CTP_CLIENT_ID / CTP_CLIENT_SECRET / CTP_SCOPE / CTP_PROJECT_KEY / CTP_API_URL / CTP_AUTH_URL at
# runtime. Nobody can paste a manage_project secret into the install form, because there is no field
# for one. Do NOT also declare those CTP_* keys under `configuration` — they are provided at runtime.
#
# This client is shared by both applications, so the list is their union; the per-application
# comments above record what each one actually needs. The price-feed job was split into its own
# connector for exactly that reason (commercetools/ecoliving-price-feed-connector).
# ---------------------------------------------------------------------------------------------
inheritAs:
  apiClient:
    scopes:
      - manage_extensions          # cart-rules-service: self-registration
      - manage_subscriptions       # order-events: self-registration
      - manage_orders              # order-events: read and transition orders
      - view_states                # order-events: expand the order's custom State
      - manage_key_value_documents # cart-rules-service: the feature-flag Custom Object
